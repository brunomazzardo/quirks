<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fcfcfc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <script>
      // Resolve the theme before first paint so the shell never flashes light
      // chrome on a dark system. The palette itself lives in src/index.css
      // (QK-NAT-009: geist neutrals following OS light/dark, plus the
      // night-ledger lamp); all this has to do is put `.dark` on <html> early
      // enough to matter, since the whole token set hangs off that class.
      (() => {
        try {
          const stored = window.localStorage.getItem("quirks:theme");
          const theme = stored === "light" || stored === "dark" ? stored : "system";
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle(
            "dark",
            theme === "dark" || (theme === "system" && prefersDark),
          );
        } catch {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Quirks</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
