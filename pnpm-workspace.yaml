packages:
  - apps/*
  - packages/*

# pnpm 11: true = allowed to run build scripts (t3code's allowBuilds subset).
allowBuilds:
  electron: true
  electron-winstaller: false
  esbuild: true
  msgpackr-extract: true
  node-pty: true

catalog:
  "@effect/atom-react": 4.0.0-beta.102
  "@effect/platform-node": 4.0.0-beta.102
  "@effect/platform-node-shared": 4.0.0-beta.102
  "@effect/vitest": 4.0.0-beta.102
  "@types/node": 24.12.4
  "@typescript/native-preview": 7.0.0-dev.20260604.1
  effect: 4.0.0-beta.102
  typescript: ~6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@0.2.2
  vite-plus: 0.2.2

overrides:
  "@effect/atom-react": "catalog:"
  "@effect/platform-node": "catalog:"
  "@effect/platform-node-shared": "catalog:"
  "@effect/vitest": "catalog:"
  "@types/node": "catalog:"
  effect: "catalog:"
  vite: "catalog:"

packageExtensions:
  "@effect/vitest@*":
    dependencies:
      vite-plus: "catalog:"
    peerDependenciesMeta:
      vitest:
        optional: true
  vite-plus@*:
    dependencies:
      vite: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
